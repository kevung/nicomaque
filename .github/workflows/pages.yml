# Publication de la documentation sur GitHub Pages, à chaque poussée sur la branche principale.
#
# La documentation (doc/, Sphinx) est construite en français et en anglais (doc/build.py) et
# déployée telle quelle. Une chaîne anglaise non traduite retombe sur le français.
#
# L'URL est https://kevung.github.io/nicomaque/ et elle est STABLE : elle est citée depuis les
# logiciels hôtes. La racine redirige vers le français.
name: Site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Dépendances
        run: pip install -r doc/requirements.txt
      - name: Construire le français et l'anglais
        run: python doc/build.py
      - name: La traduction anglaise est-elle complète ?
        # Une page modifiée sans que son catalogue soit régénéré et traduit retombe en silence sur
        # le français. On le signale ici (avertissement, sans échec).
        run: |
          sudo apt-get install -y -qq gettext >/dev/null
          SPHINX_BUILD=sphinx-build scripts/doc-i18n-check.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: doc/build/site

  deployer:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
